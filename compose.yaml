services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: saldo
      POSTGRES_USER: saldo
      POSTGRES_PASSWORD: saldo
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saldo"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://saldo:saldo@postgres:5432/saldo
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
